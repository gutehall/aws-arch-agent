default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: aws-arch-agent
        name: aws-arch-agent
        entry: aws-arch-agent --repo . --no-llm --fail-on high --enforce-baseline
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: no-tracker-ids
        name: no DM3 tracker IDs in commit messages
        # Skips git's "#" comment lines, which name the current branch.
        entry: '(?i)^(?!#).*dm3-[0-9]+'
        language: pygrep
        stages: [commit-msg]
