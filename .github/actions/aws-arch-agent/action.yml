name: AWS Arch Agent
description: Run aws-arch-agent architecture review on a CDK, CloudFormation, or Terraform repository. This action stays on Python 3.11. CI tests 3.11 and 3.12.
inputs:
  repo:
    description: Path to the repository to scan
    required: false
    default: .
  mode:
    description: Analysis mode (v1 or v2)
    required: false
    default: v1
  iac:
    description: IaC source (auto, cdk, cloudformation, or terraform). auto detects from the repo. With mode v2, terraform exits 1, and cloudformation needs a templates path in the repo config file.
    required: false
    default: auto
  format:
    description: Output format (markdown, json, sarif, or html). With html, set out to a .html path.
    required: false
    default: markdown
  out:
    description: Output report path
    required: false
    default: report.md
  fail-on:
    description: Exit non-zero if findings at or above severity (high|medium|low|none)
    required: false
    default: none
  no-llm:
    description: Skip LLM (true/false)
    required: false
    default: "true"
  no-synth:
    description: Skip CDK synth in V2 (true/false)
    required: false
    default: "false"
  llm-mode:
    description: V2 LLM mode (full or compact)
    required: false
    default: full
  baseline:
    description: Path to baseline file
    required: false
    default: ""
  enforce-baseline:
    description: Only fail on findings not in baseline (true/false)
    required: false
    default: "false"
  upload-artifact:
    description: Upload report as workflow artifact (true/false)
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install ripgrep (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: command -v rg >/dev/null || { sudo apt-get update && sudo apt-get install -y ripgrep; }

    - name: Install ripgrep (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: command -v rg >/dev/null || brew install ripgrep

    - name: Install ripgrep (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: command -v rg >/dev/null || choco install ripgrep -y --no-progress

    - name: Install aws-arch-agent
      shell: bash
      run: |
        python -m pip install -U pip
        # Install from the action's own checkout, not the caller's working directory.
        # Python resolves the path so it is native on every runner OS (Git Bash on Windows).
        ACTION_ROOT="$(python -c 'import os, sys; print(os.path.abspath(sys.argv[1]))' "$GITHUB_ACTION_PATH/../../..")"
        python -m pip install "${ACTION_ROOT}[v2]"

    - name: Run AWS Arch Agent
      shell: bash
      env:
        REPO: ${{ inputs.repo }}
        MODE: ${{ inputs.mode }}
        IAC: ${{ inputs.iac }}
        FORMAT: ${{ inputs.format }}
        OUT: ${{ inputs.out }}
        FAIL_ON: ${{ inputs.fail-on }}
        NO_LLM: ${{ inputs.no-llm }}
        NO_SYNTH: ${{ inputs.no-synth }}
        LLM_MODE: ${{ inputs.llm-mode }}
        BASELINE: ${{ inputs.baseline }}
        ENFORCE_BASELINE: ${{ inputs.enforce-baseline }}
      run: |
        ARGS=(
          --repo "$REPO"
          --mode "$MODE"
          --iac "${IAC:-auto}"
          --format "$FORMAT"
          --out "$OUT"
          --fail-on "$FAIL_ON"
          --llm-mode "$LLM_MODE"
        )
        if [ "$NO_LLM" = "true" ]; then
          ARGS+=(--no-llm)
        fi
        if [ "$NO_SYNTH" = "true" ]; then
          ARGS+=(--no-synth)
        fi
        if [ -n "$BASELINE" ]; then
          ARGS+=(--baseline "$BASELINE")
        fi
        if [ "$ENFORCE_BASELINE" = "true" ]; then
          ARGS+=(--enforce-baseline)
        fi
        aws-arch-agent "${ARGS[@]}"

    - name: Upload report artifact
      if: inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: aws-arch-agent-report
        path: ${{ inputs.out }}
        if-no-files-found: ignore
