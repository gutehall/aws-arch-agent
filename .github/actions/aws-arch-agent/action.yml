name: AWS Arch Agent
description: Run aws-arch-agent architecture review on a CDK, CloudFormation, or Terraform repository. This action stays on Python 3.11. CI tests 3.11 and 3.12.
inputs:
  repo:
    description: Path to the repository to scan
    required: false
    default: .
  mode:
    description: Analysis mode (v1 or v2)
    required: false
    default: v1
  iac:
    description: IaC source (auto, cdk, cloudformation, or terraform). auto detects from the repo. Mode v2 scans terraform too; with mode v2, cloudformation needs the templates input or a templates path in the repo config file.
    required: false
    default: auto
  format:
    description: Output format (markdown, json, sarif, or html). With html, set out to a .html path.
    required: false
    default: markdown
  out:
    description: Output report path
    required: false
    default: report.md
  fail-on:
    description: Exit non-zero if findings at or above severity (high|medium|low|none)
    required: false
    default: none
  no-llm:
    description: Skip LLM (true/false)
    required: false
    default: "true"
  no-synth:
    description: Skip CDK synth in V2 (true/false)
    required: false
    default: "false"
  llm-mode:
    description: V2 LLM mode (full or compact)
    required: false
    default: full
  baseline:
    description: Path to baseline file
    required: false
    default: ""
  enforce-baseline:
    description: Only fail on findings not in baseline (true/false)
    required: false
    default: "false"
  upload-artifact:
    description: Upload report as workflow artifact (true/false)
    required: false
    default: "true"
  tf-plan:
    description: Path to `terraform show -json` output (a plan or a state) for Terraform scans. Empty passes no flag
    required: false
    default: ""
  live-account:
    description: Read the AWS account with read-only describe and list calls (true/false). true also installs the account extra (boto3); the job needs AWS credentials and a Region (region input or AWS_REGION)
    required: false
    default: "false"
  region:
    description: AWS Region for price estimates and live-account reads. Empty passes no flag
    required: false
    default: ""
  theme:
    description: Only report rules in these themes, comma-separated (e.g. security-baseline,finops). Empty passes no flag
    required: false
    default: ""
  group-by:
    description: Group Markdown findings by severity or theme. Empty passes no flag
    required: false
    default: ""
  config:
    description: Path to a config file (JSON or YAML). Empty auto-detects one in the repo root
    required: false
    default: ""
  templates:
    description: Path to CloudFormation templates (dir or file); V2 only, skips cdk synth. Empty passes no flag
    required: false
    default: ""
  job-summary:
    description: Append a Markdown report to the job summary (true/false). With a format other than markdown, a second rules-only run (no LLM, fail-on none) renders it. The step still exits with the scan's exit code
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Install ripgrep (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: command -v rg >/dev/null || { sudo apt-get update && sudo apt-get install -y ripgrep; }

    - name: Install ripgrep (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: command -v rg >/dev/null || brew install ripgrep

    - name: Install ripgrep (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if (Get-Command rg -ErrorAction SilentlyContinue) {
          rg --version
          exit 0
        }
        $version = "15.2.0"
        $zip = Join-Path $env:RUNNER_TEMP "ripgrep.zip"
        $dest = Join-Path $env:RUNNER_TEMP "ripgrep"
        $url = "https://github.com/BurntSushi/ripgrep/releases/download/$version/ripgrep-$version-x86_64-pc-windows-msvc.zip"
        curl.exe -fsSL -o $zip $url
        if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
        Expand-Archive $zip -DestinationPath $dest
        $rg = Get-ChildItem -Path $dest -Filter rg.exe -Recurse | Select-Object -First 1
        if (-not $rg) { throw "rg.exe not found in ripgrep $version zip" }
        Add-Content -Path $env:GITHUB_PATH -Value $rg.DirectoryName
        $env:PATH = "$($rg.DirectoryName);$env:PATH"
        rg --version

    - name: Install aws-arch-agent
      shell: bash
      env:
        LIVE_ACCOUNT: ${{ inputs.live-account }}
      run: |
        python -m pip install -U pip
        # Install from the action's own checkout, not the caller's working directory.
        # Python resolves the path so it is native on every runner OS (Git Bash on Windows).
        ACTION_ROOT="$(python -c 'import os, sys; print(os.path.abspath(sys.argv[1]))' "$GITHUB_ACTION_PATH/../../..")"
        if [ "$LIVE_ACCOUNT" = "true" ]; then
          python -m pip install "${ACTION_ROOT}[v2,account]"
        else
          python -m pip install "${ACTION_ROOT}[v2]"
        fi

    - name: Run AWS Arch Agent
      shell: bash
      env:
        REPO: ${{ inputs.repo }}
        MODE: ${{ inputs.mode }}
        IAC: ${{ inputs.iac }}
        FORMAT: ${{ inputs.format }}
        OUT: ${{ inputs.out }}
        FAIL_ON: ${{ inputs.fail-on }}
        NO_LLM: ${{ inputs.no-llm }}
        NO_SYNTH: ${{ inputs.no-synth }}
        LLM_MODE: ${{ inputs.llm-mode }}
        BASELINE: ${{ inputs.baseline }}
        ENFORCE_BASELINE: ${{ inputs.enforce-baseline }}
        TF_PLAN: ${{ inputs.tf-plan }}
        LIVE_ACCOUNT: ${{ inputs.live-account }}
        REGION: ${{ inputs.region }}
        THEME: ${{ inputs.theme }}
        GROUP_BY: ${{ inputs.group-by }}
        CONFIG: ${{ inputs.config }}
        TEMPLATES: ${{ inputs.templates }}
        JOB_SUMMARY: ${{ inputs.job-summary }}
      run: |
        ARGS=(
          --repo "$REPO"
          --mode "$MODE"
          --iac "${IAC:-auto}"
          --format "$FORMAT"
          --out "$OUT"
          --fail-on "$FAIL_ON"
          --llm-mode "$LLM_MODE"
        )
        if [ "$NO_LLM" = "true" ]; then
          ARGS+=(--no-llm)
        fi
        if [ "$NO_SYNTH" = "true" ]; then
          ARGS+=(--no-synth)
        fi
        if [ -n "$BASELINE" ]; then
          ARGS+=(--baseline "$BASELINE")
        fi
        if [ "$ENFORCE_BASELINE" = "true" ]; then
          ARGS+=(--enforce-baseline)
        fi
        if [ -n "$TF_PLAN" ]; then
          ARGS+=(--tf-plan "$TF_PLAN")
        fi
        if [ "$LIVE_ACCOUNT" = "true" ]; then
          ARGS+=(--live-account)
        fi
        if [ -n "$REGION" ]; then
          ARGS+=(--region "$REGION")
        fi
        if [ -n "$THEME" ]; then
          ARGS+=(--theme "$THEME")
        fi
        if [ -n "$GROUP_BY" ]; then
          ARGS+=(--group-by "$GROUP_BY")
        fi
        if [ -n "$CONFIG" ]; then
          ARGS+=(--config "$CONFIG")
        fi
        if [ -n "$TEMPLATES" ]; then
          ARGS+=(--templates "$TEMPLATES")
        fi

        # Keep the scan's exit code (1 for --fail-on, 2 for report warnings) so the
        # summary is still written, then exit with it.
        rc=0
        aws-arch-agent "${ARGS[@]}" || rc=$?

        if [ "$JOB_SUMMARY" = "true" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          SUMMARY_MD="$OUT"
          if [ "$FORMAT" != "markdown" ]; then
            # Render Markdown with a second run that cannot fail the build or call an LLM.
            SUMMARY_MD="${RUNNER_TEMP:-.}/aws-arch-agent-summary.md"
            SUMMARY_ARGS=()
            skip=0
            for arg in "${ARGS[@]}"; do
              if [ "$skip" = 1 ]; then
                skip=0
                continue
              fi
              case "$arg" in
                --format|--out|--fail-on) skip=1 ;;
                *) SUMMARY_ARGS+=("$arg") ;;
              esac
            done
            aws-arch-agent "${SUMMARY_ARGS[@]}" --no-llm --format markdown \
              --out "$SUMMARY_MD" --fail-on none || true
          fi
          if [ -s "$SUMMARY_MD" ]; then
            # GitHub keeps at most 1 MiB of summary per step.
            limit=1000000
            if [ "$(wc -c < "$SUMMARY_MD")" -gt "$limit" ]; then
              head -c "$limit" "$SUMMARY_MD" >> "$GITHUB_STEP_SUMMARY"
              printf '\n\n_Report truncated for the job summary; see the report artifact._\n' >> "$GITHUB_STEP_SUMMARY"
            else
              cat "$SUMMARY_MD" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            printf '## AWS Arch Agent\n\nNo Markdown report was written (exit code %s).\n' "$rc" >> "$GITHUB_STEP_SUMMARY"
          fi
        fi
        exit "$rc"

    - name: Upload report artifact
      if: always() && inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: aws-arch-agent-report
        path: ${{ inputs.out }}
        if-no-files-found: ignore
