# Run AWS Arch Agent on the repo (and optionally fail on findings)
name: AWS Arch Agent

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  review:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -e ".[dev]"
          .venv/bin/pip install types-PyYAML

      - name: Run tests with coverage
        run: .venv/bin/pytest tests/ -n auto -q --cov=aws_arch_agent --cov-fail-under=70

      - name: Lint (ruff)
        run: .venv/bin/ruff check src tests

      - name: Type check (mypy)
        run: .venv/bin/mypy src

      - name: Run AWS Arch Agent (rules only, no LLM)
        run: .venv/bin/aws-arch-agent --repo . --no-llm --out report.md

      - name: Run AWS Arch Agent (JSON, fail on high)
        run: .venv/bin/aws-arch-agent --repo . --no-llm --format json --out report.json --fail-on high --enforce-baseline --baseline .aws-arch-agent-baseline.json

      - name: Run AWS Arch Agent V2 smoke
        run: .venv/bin/aws-arch-agent --repo . --mode v2 --no-llm --no-synth --out report-v2.md

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aws-arch-agent-report-py${{ matrix.python-version }}
          path: |
            report.md
            report.json
            report-v2.md
          if-no-files-found: ignore

  cdk-synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -e ".[dev]"

      - name: Install Node dependencies for CDK fixture
        working-directory: tests/fixtures/minimal-cdk
        run: npm install

      - name: Run CDK synth integration test
        # The 70% gate is for the full suite. This job runs one test.
        run: .venv/bin/pytest tests/test_cdk_synth.py::test_run_cdk_synth_on_minimal_fixture -v --no-cov

  windows:
    # The scanner runs subprocesses (ripgrep, npx) and reads paths; check it on Windows too.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ripgrep
        run: |
          choco install ripgrep -y --no-progress
          rg --version  # fail here, not as a skipped test, if rg is not on PATH

      - name: Install Python dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]" types-PyYAML

      - name: Install Node dependencies for CDK fixture
        working-directory: tests/fixtures/minimal-cdk
        run: npm install

      - name: Run tests in parallel
        # The 70% coverage gate runs in the review job on Linux. Coverage and a serial run
        # made this job take over an hour; the tests here check subprocesses and paths.
        run: python -m pytest tests/ -n auto -q --no-cov

  action-smoke:
    # The composite action must install and run on every runner OS.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Run the action on the CDK fixture
        uses: ./.github/actions/aws-arch-agent
        with:
          repo: tests/fixtures/minimal-cdk
          no-llm: "true"
          out: report.md
          upload-artifact: "false"

      - name: Check the report was written
        shell: bash
        run: test -s report.md
