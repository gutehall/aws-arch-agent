# Run AWS Arch Agent on the repo (and optionally fail on findings)
name: AWS Arch Agent

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  review:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -e ".[dev]"
          .venv/bin/pip install types-PyYAML

      - name: Run tests with coverage
        run: .venv/bin/pytest tests/ -n auto -q --cov=aws_arch_agent --cov-fail-under=70

      - name: Lint (ruff)
        run: .venv/bin/ruff check src tests

      - name: Type check (mypy)
        run: .venv/bin/mypy src

      - name: Run AWS Arch Agent (rules only, no LLM)
        run: .venv/bin/aws-arch-agent --repo . --no-llm --out report.md

      - name: Run AWS Arch Agent (JSON, fail on high)
        run: .venv/bin/aws-arch-agent --repo . --no-llm --format json --out report.json --fail-on high --enforce-baseline --baseline .aws-arch-agent-baseline.json

      - name: Run AWS Arch Agent V2 smoke
        run: .venv/bin/aws-arch-agent --repo . --mode v2 --no-llm --no-synth --out report-v2.md

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aws-arch-agent-report-py${{ matrix.python-version }}
          path: |
            report.md
            report.json
            report-v2.md
          if-no-files-found: ignore

  cdk-synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -e ".[dev]"

      - name: Install Node dependencies for CDK fixture
        working-directory: tests/fixtures/minimal-cdk
        run: npm install

      - name: Run CDK synth integration test
        # The 70% gate is for the full suite. This job runs one test.
        run: .venv/bin/pytest tests/test_cdk_synth.py::test_run_cdk_synth_on_minimal_fixture -v --no-cov

  windows:
    # The scanner runs subprocesses (ripgrep, npx) and reads paths; check it on Windows too.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/fixtures/minimal-cdk/package-lock.json

      - name: Install ripgrep
        shell: pwsh
        run: |
          $version = "15.2.0"
          $zip = Join-Path $env:RUNNER_TEMP "ripgrep.zip"
          $dest = Join-Path $env:RUNNER_TEMP "ripgrep"
          $url = "https://github.com/BurntSushi/ripgrep/releases/download/$version/ripgrep-$version-x86_64-pc-windows-msvc.zip"
          curl.exe -fsSL -o $zip $url
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          Expand-Archive $zip -DestinationPath $dest
          $rg = Get-ChildItem -Path $dest -Filter rg.exe -Recurse | Select-Object -First 1
          if (-not $rg) { throw "rg.exe not found in ripgrep $version zip" }
          Add-Content -Path $env:GITHUB_PATH -Value $rg.DirectoryName
          $env:PATH = "$($rg.DirectoryName);$env:PATH"
          rg --version

      - name: Install Python dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e . pytest pytest-cov

      - name: Install Node dependencies for CDK fixture
        working-directory: tests/fixtures/minimal-cdk
        run: npm install

      - name: Run Windows path and subprocess tests
        # The 70% coverage gate runs in the review job on Linux. A full scan here
        # starts ripgrep once per rule and takes over an hour. These tests check
        # ripgrep encoding, npx on Windows, and one scan.
        run: python -m pytest tests/test_rg_encoding.py tests/test_cdk_synth.py tests/test_smoke.py -q --no-cov

  action-smoke:
    # The composite action must install and run on every runner OS.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Run the action on the CDK fixture
        uses: ./.github/actions/aws-arch-agent
        with:
          repo: tests/fixtures/minimal-cdk
          no-llm: "true"
          out: report.md
          upload-artifact: "false"
          group-by: theme
          job-summary: "true"

      - name: Check the report was written
        shell: bash
        run: test -s report.md

      - name: Run the action with SARIF and a job summary
        uses: ./.github/actions/aws-arch-agent
        with:
          repo: tests/fixtures/minimal-cdk
          no-llm: "true"
          format: sarif
          out: report.sarif
          region: eu-west-1
          theme: security-baseline,data-protection
          upload-artifact: "false"
          job-summary: "true"

      - name: Check the SARIF report was written
        shell: bash
        run: test -s report.sarif
