# Publish a GitHub release, and the same version to PyPI, when a version tag is pushed.
# The tag is pushed by hand (see CONTRIBUTING.md#releases); this workflow never creates or
# moves a tag, and leaves an existing release alone.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.existing.outputs.exists == 'false' }}
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Skip if the release already exists
        id: existing
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it alone."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the tag is on main
        if: steps.existing.outputs.exists == 'false'
        run: |
          git fetch origin main
          commit=$(git rev-parse "$TAG^{commit}")
          git merge-base --is-ancestor "$commit" origin/main \
            || { echo "$TAG ($commit) is not on main"; exit 1; }

      - name: Build notes from CHANGELOG.md
        if: steps.existing.outputs.exists == 'false'
        run: python3 scripts/release_notes.py "$TAG" > "$RUNNER_TEMP/notes.md"

      - name: Create the release
        if: steps.existing.outputs.exists == 'false'
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

  # Same tag, same commit. Trusted publishing: the id-token is minted only in this job.
  # Off until the repository variable PUBLISH_TO_PYPI is 'true', which needs a PyPI trusted
  # publisher registered for this repository, workflow and the pypi environment.
  pypi:
    needs: release
    if: needs.release.outputs.created == 'true' && vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Build the sdist and wheel
        run: |
          python -m pip install build
          python -m build

      - name: Check the built version is the tag
        run: |
          python - <<'PY'
          import glob, os, sys
          tag = os.environ["TAG"].lstrip("v")
          bad = [f for f in glob.glob("dist/*") if f"-{tag}" not in os.path.basename(f)]
          if bad or not glob.glob("dist/*"):
              sys.exit(f"dist does not match tag {tag}: {bad}")
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
