# Check that every AWS documentation page the reports link to still exists.
# It needs docs.aws.amazon.com, so it runs apart from the main CI: on changes to the link map,
# weekly (AWS moves pages without notice), and by hand.
name: Doc links

on:
  pull_request:
    branches: [main, master]
    paths:
      - src/aws_arch_agent/report/doc_topics.py
      - src/aws_arch_agent/report/docs.py
      - scripts/check_doc_links.py
      - .github/workflows/doc-links.yml
  push:
    branches: [main, master]
    paths:
      - src/aws_arch_agent/report/doc_topics.py
      - src/aws_arch_agent/report/docs.py
      - scripts/check_doc_links.py
      - .github/workflows/doc-links.yml
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install aws-arch-agent
        run: |
          python -m pip install -U pip
          python -m pip install -e .

      - name: Check documentation links
        run: python scripts/check_doc_links.py
