[project]
name = "aws-arch-agent"
version = "0.1.0"
description = "Agentic AWS CDK reviewer (local-first)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name="Mathias Gutehall"}]
license = {text="MIT"}
dependencies = [
  "typer>=0.12.3",
  "rich>=13.7.1",
  "pydantic>=2.7.0",
  "requests>=2.32.0",
  "python-dotenv>=1.0.1",
  # V2 (advanced)
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
]

[project.optional-dependencies]
cloud = [
  "openai>=1.40.0",
  "anthropic>=0.34.0",
]
rag = [
  "sentence-transformers>=2.2.0",
]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "types-requests>=2.32.0",
]

[project.scripts]
aws-arch-agent = "aws_arch_agent.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
exclude = ["\\.venv/", "build/"]
