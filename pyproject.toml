[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aws_arch_agent"]

[tool.hatch.build.targets.wheel.sources]
"src/aws_arch_agent" = "aws_arch_agent"

[project]
name = "aws-arch-agent"
version = "0.1.0"
description = "Agentic AWS CDK reviewer (local-first)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name="Mathias Gutehall"}]
license = {text="MIT"}
keywords = ["aws", "cdk", "well-architected", "architecture-review", "langgraph"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "typer>=0.12.3",
  "rich>=13.7.1",
  "pydantic>=2.7.0",
  "requests>=2.32.0",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0",
  # V2 (advanced)
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
]

[project.optional-dependencies]
cloud = [
  "openai>=1.40.0",
  "anthropic>=0.34.0",
]
rag = [
  "sentence-transformers>=2.2.0",
]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "types-requests>=2.32.0",
  "types-PyYAML>=6.0",
]

[project.scripts]
aws-arch-agent = "aws_arch_agent.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=aws_arch_agent --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
exclude = ["\\.venv/", "build/"]
